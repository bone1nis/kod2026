<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Три символа на Вратах</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene">
    <img class="scene__bg" src="img/bg.svg" alt="Каменные врата замка">

    <div class="glyph glyph--1">
      <img src="img/glyph-1.svg" alt="Первый символ">
    </div>
    <div class="glyph glyph--2">
      <img src="img/glyph-2.svg" alt="Второй символ">
    </div>
    <div class="glyph glyph--3">
      <img src="img/glyph-3.svg" alt="Третий символ">
    </div>
  </div>
</body>
</html>
