<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset=".6" stop-color="#1a1840"/>
      <stop offset="1" stop-color="#34265a"/>
    </linearGradient>
    <radialGradient id="moon" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset=".7" stop-color="#e9dcb4"/>
      <stop offset="1" stop-color="#e9dcb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b9c8ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b9c8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c6878"/>
      <stop offset="1" stop-color="#3a3644"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1d16"/>
      <stop offset=".5" stop-color="#4a3326"/>
      <stop offset="1" stop-color="#2a1d16"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f86c9" stop-opacity="0"/>
      <stop offset="1" stop-color="#8f86c9" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8598"/>
      <stop offset="1" stop-color="#4b4757"/>
    </linearGradient>
    <clipPath id="arch"><path d="M470 790 V380 Q800 120 1130 380 V790 Z"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1290" cy="160" r="180" fill="url(#halo)"/>
  <circle cx="1290" cy="160" r="62" fill="url(#moon)"/>
  <g fill="#fff">
    <circle cx="140" cy="90" r="1.8" opacity=".8"/><circle cx="310" cy="170" r="1.2" opacity=".6"/>
    <circle cx="470" cy="70" r="1.6" opacity=".7"/><circle cx="620" cy="140" r="1" opacity=".5"/>
    <circle cx="980" cy="60" r="1.4" opacity=".7"/><circle cx="1080" cy="190" r="1" opacity=".5"/>
    <circle cx="1500" cy="300" r="1.5" opacity=".6"/><circle cx="90" cy="320" r="1.2" opacity=".5"/>
    <circle cx="760" cy="40" r="1.2" opacity=".6"/><circle cx="1440" cy="80" r="1" opacity=".5"/>
  </g>

  <!-- дальние горы -->
  <path d="M0 640 L170 470 L300 560 L430 420 L560 580 L0 700 Z" fill="#141331"/>
  <path d="M1040 580 L1200 440 L1330 540 L1460 410 L1600 520 L1600 700 Z" fill="#141331"/>

  <!-- стена -->
  <rect x="320" y="300" width="960" height="500" fill="url(#stone)"/>
  <g stroke="#2b2834" stroke-width="3" opacity=".7">
    <line x1="320" y1="400" x2="1280" y2="400"/><line x1="320" y1="500" x2="1280" y2="500"/>
    <line x1="320" y1="600" x2="1280" y2="600"/><line x1="320" y1="700" x2="1280" y2="700"/>
    <line x1="400" y1="300" x2="400" y2="400"/><line x1="1200" y1="300" x2="1200" y2="400"/>
    <line x1="360" y1="400" x2="360" y2="500"/><line x1="1240" y1="400" x2="1240" y2="500"/>
    <line x1="420" y1="500" x2="420" y2="600"/><line x1="1180" y1="500" x2="1180" y2="600"/>
    <line x1="370" y1="600" x2="370" y2="700"/><line x1="1230" y1="600" x2="1230" y2="700"/>
  </g>
  <rect x="300" y="280" width="1000" height="28" fill="#4c4858"/>

  <!-- арка -->
  <path d="M440 790 V370 Q800 80 1160 370 V790 Z" fill="#2e2b38"/>
  <path d="M470 790 V380 Q800 120 1130 380 V790 Z" fill="url(#door)"/>
  <g clip-path="url(#arch)">
    <g stroke="#1b120d" stroke-width="4" opacity=".6">
      <line x1="540" y1="150" x2="540" y2="790"/><line x1="620" y1="150" x2="620" y2="790"/>
      <line x1="700" y1="150" x2="700" y2="790"/><line x1="900" y1="150" x2="900" y2="790"/>
      <line x1="980" y1="150" x2="980" y2="790"/><line x1="1060" y1="150" x2="1060" y2="790"/>
    </g>
    <g fill="#1c1a22">
      <rect x="470" y="300" width="660" height="22"/>
      <rect x="470" y="680" width="660" height="22"/>
    </g>
    <line x1="800" y1="100" x2="800" y2="790" stroke="#140d09" stroke-width="10"/>
  </g>
  <!-- замковый камень -->
  <path d="M770 120 L830 120 L845 200 L755 200 Z" fill="#7b7689" stroke="#2b2834" stroke-width="4"/>

  <!-- три камня с углублениями: на них стоят символы -->
  <g stroke="#24212c" stroke-width="5">
    <rect x="420" y="450" width="160" height="160" rx="22" fill="url(#rock)"/>
    <rect x="720" y="320" width="160" height="160" rx="22" fill="url(#rock)"/>
    <rect x="1020" y="450" width="160" height="160" rx="22" fill="url(#rock)"/>
  </g>
  <g fill="#2f2c39" opacity=".55">
    <circle cx="500" cy="530" r="58"/><circle cx="800" cy="400" r="58"/><circle cx="1100" cy="530" r="58"/>
  </g>

  <!-- земля и туман -->
  <path d="M0 780 Q400 750 800 785 T1600 770 V900 H0 Z" fill="#0f0e19"/>
  <rect y="640" width="1600" height="260" fill="url(#mist)"/>
</svg>
